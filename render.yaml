services:
  - type: web
    name: smart-expense-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/api/health"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-expense-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'

databases:
  - name: smart-expense-db
    plan: free
    region: oregon
    databaseName: smart_expense_db
    user: postgres
